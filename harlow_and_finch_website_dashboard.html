function Icon({ name, size = 16, color = "currentColor", strokeWidth = 2, fill = "none", style }) {
  const shapes = ICONS[name] || [];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, ...style }}>
      {shapes.map((s, i) => {
        if (s.t === "path") return <path key={i} d={s.d} fill={s.fillOnly ? color : (name === "heart" ? fill : "none")} />;
        if (s.t === "circle") return <circle key={i} cx={s.cx} cy={s.cy} r={s.r} fill={s.fillOnly ? color : "none"} />;
        if (s.t === "line") return <line key={i} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} />;
        if (s.t === "rect") return <rect key={i} x={s.x} y={s.y} width={s.w} height={s.h} rx={s.rx || 0} fill={s.fillOnly ? color : "none"} stroke={s.fillOnly ? "none" : color} />;
        if (s.t === "polyline") return <polyline key={i} points={s.points} />;
        if (s.t === "polygon") return <polygon key={i} points={s.points} />;
        return null;
      })}
    </svg>
  );
}

function MiniBarChart({ data }) {
  const max = Math.max(...data.map(d => d.views));
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', height: 140, gap: 12, paddingTop: 20, paddingBottom: 10 }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', height: '100%' }}>
          <div style={{ fontSize: 11, color: '#d4af37', marginBottom: 4, fontWeight: 600 }}>{d.views}</div>
          <div style={{ flex: 1, width: '100%', display: 'flex', alignItems: 'flex-end', background: 'rgba(255,255,255,0.03)', borderRadius: 4 }}>
            <div style={{
              width: '100%',
              height: `${(d.views / max) * 100}%`,
              background: 'linear-gradient(180deg, #d4af37 0%, #a9803f 100%)',
              borderRadius: 4,
              transition: 'height 0.3s'
            }} />
          </div>
          <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 6 }}>{d.day}</div>
        </div>
      ))}
    </div>
  );
}

    { from: "agent", text: "Hi Marwan! Thanks for your interest in Harlow & Finch listings.", t: "09:14" },

  const [draft, setDraft] = useState("");

  const [leads, setLeads] = useState([

    { id: 102, name: "Niamh O'Riordan", listing: "Canal-side Two-Bed", when: "Sat, 11:30", source: "Website", status: "Pending" },
  ]);
  const [activity, setActivity] = useState([
    { id: "a1", text: "Niamh O'Riordan requested a viewing — Canal-side Two-Bed", time: "yesterday" },
  ]);
  const [unreadLeads, setUnreadLeads] = useState(0);
  const [dashToast, setDashToast] = useState(null);

  const selectedListing = listings.find((l) => l.id === selectedId);

  const filteredListings = listings.filter((l) => {
    const matchType = filter === "All" || l.type === filter;
    const matchSearch = searchQuery === "" || 
      l.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
      l.location.toLowerCase().includes(searchQuery.toLowerCase());
    return matchType && matchSearch;
  });

  function logActivity(text) {
    setActivity((a) => [{ id: Date.now(), text, time: "just now" }, ...a].slice(0, 8));
  }

  function openListing(id) {
    setSelectedId(id);
    const l = listings.find((x) => x.id === id);
    if (l) {
      logActivity(`${DEMO_USER} viewed "${l.title}"`);
    }
  }

  function toggleSave(id) {
    setSavedIds((prev) => {
      const has = prev.includes(id);
      const l = listings.find((x) => x.id === id);
      if (l) {
        logActivity(`${DEMO_USER} ${has ? "unsaved" : "saved"} "${l.title}"`);
      }
      return has ? prev.filter((x) => x !== id) : [...prev, id];
    });
  }

  function confirmSchedule() {
    if (!selectedListing) return;
    const newLead = {
      id: Date.now(),
      name: DEMO_USER,
      listing: selectedListing.title,
      when: `${confirmDate}, ${confirmTime}`,
      source: view === "mobile" ? "Mobile App" : "Website",
      status: "Pending",
    };
    setLeads((prev) => [newLead, ...prev]);
    setUnreadLeads((n) => n + 1);
    setShowSchedule(false);
    
    const msg = `Viewing requested for "${selectedListing.title}" — Sarah will confirm shortly`;

    setWebToast(msg);

    setDashToast(`New lead from ${newLead.source}: ${DEMO_USER}`);

      type: newType,

                        <tr>
                          <th style={{ padding: '14px 20px' }}>Client Name</th>
                          <th style={{ padding: '14px 20px' }}>Requested Property</th>
                          <th style={{ padding: '14px 20px' }}>Scheduled Date/Time</th>
                          <th style={{ padding: '14px 20px' }}>Source</th>
                          <th style={{ padding: '14px 20px' }}>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        {leads.map((ld) => (
                          <tr key={ld.id} style={{ borderBottom: '1px solid #1e293b' }}>
                            <td style={{ padding: '16px 20px', fontWeight: 600, color: '#f8fafc' }}>{ld.name}</td>
                            <td style={{ padding: '16px 20px' }}>{ld.listing}</td>
                            <td style={{ padding: '16px 20px', color: '#fef08a' }}>{ld.when}</td>
                            <td style={{ padding: '16px 20px' }}>{ld.source}</td>
                            <td style={{ padding: '16px 20px' }}>
                              <span style={{
                                background: ld.status === 'Confirmed' ? 'rgba(16, 185, 129, 0.2)' : 'rgba(239, 68, 68, 0.2)',
                                color: ld.status === 'Confirmed' ? '#34d399' : '#f87171',
                                padding: '4px 10px', borderRadius: 20, fontSize: 12, fontWeight: 600
                              }}>
                                {ld.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Calendar Tab */}
              {dashTab === "calendar" && (
                <div>
                  <h2 style={{ fontSize: 24, fontWeight: 700, color: '#f8fafc', marginBottom: 20 }}>Viewing Schedule</h2>
                  <div style={{ display: 'grid', gap: 16 }}>
                    {leads.map((ld) => (
                      <div key={ld.id} style={{ background: '#0f172a', border: '1px solid #1e293b', padding: 20, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                          <div style={{ background: '#1e293b', color: '#d4af37', padding: '12px 18px', borderRadius: 8, fontWeight: 700, textAlign: 'center' }}>
                            {ld.when}
                          </div>
                          <div>
                            <div style={{ fontSize: 16, fontWeight: 700, color: '#f8fafc' }}>{ld.listing}</div>
                            <div style={{ fontSize: 13, color: '#94a3b8' }}>Client: {ld.name} ({ld.source})</div>
                          </div>
                        </div>
                        <span style={{ background: 'rgba(212, 175, 55, 0.2)', color: '#d4af37', padding: '6px 14px', borderRadius: 20, fontSize: 13, fontWeight: 600 }}>
                          {ld.status}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>
          </div>
        )}

        {/* ------------------------------------------------------------------ */}
        {/* VIEW 3: MOBILE APP PREVIEW                                          */}
        {/* ------------------------------------------------------------------ */}
        {view === "mobile" && (
          <div style={{ flex: 1, padding: '40px 20px', display: 'flex', justifyContent: 'center', background: '#080d1a' }}>
            <div style={{
              width: 380, height: 740, background: '#0f172a', borderRadius: 44,
              border: '12px solid #1e293b', boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.7)',
              display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'hidden'
            }}>
              {/* Phone Status Bar */}
              <div style={{ height: 40, background: '#0f172a', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 24px', fontSize: 12, fontWeight: 600, color: '#cbd5e1' }}>
                <span>{timeNow()}</span>
                <div style={{ width: 80, height: 18, background: '#1e293b', borderRadius: 10 }} />
                <div style={{ display: 'flex', gap: 4 }}><Icon name="wifi" size={12} /><Icon name="battery" size={14} /></div>
              </div>

              {/* Phone Content Screen */}
              <div style={{ flex: 1, padding: 16, overflowY: 'auto' }}>
                {toastPhone && (
                  <div style={{ background: '#d4af37', color: '#0f172a', padding: 10, borderRadius: 8, fontSize: 11, fontWeight: 700, marginBottom: 12 }}>
                    {toastPhone}
                  </div>
                )}

                {phoneTab === "home" && !selectedListing && (
                  <div>
                    <div style={{ fontSize: 12, color: '#94a3b8' }}>Good morning, {DEMO_USER.split(" ")[0]}</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: '#fff', marginBottom: 14 }}>Find your home</div>

                    {/* Mobile Search */}
                    <div style={{ background: '#1e293b', padding: '8px 12px', borderRadius: 8, display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                      <Icon name="search" size={14} color="#94a3b8" />
                      <input 
                        placeholder="Search Dublin..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        style={{ background: 'transparent', border: 'none', color: '#fff', fontSize: 12, outline: 'none', width: '100%' }}
                      />
                    </div>

                    <div style={{ display: 'flex', gap: 8, marginBottom: 16, overflowX: 'auto' }}>
                      {["All", "House", "Apartment", "Duplex"].map((f) => (
                        <button key={f} onClick={() => setFilter(f)} style={{
                          background: filter === f ? '#d4af37' : '#1e293b',
                          color: filter === f ? '#0f172a' : '#cbd5e1', border: 'none',
                          padding: '6px 12px', borderRadius: 14, fontSize: 11, fontWeight: 600, cursor: 'pointer'
                        }}>{f}</button>
                      ))}
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                      {filteredListings.map((l) => (
                        <div key={l.id} onClick={() => openListing(l.id)} style={{ background: '#1e293b', borderRadius: 12, overflow: 'hidden', cursor: 'pointer' }}>
                          <img src={l.image} style={{ width: '100%', height: 130, objectFit: 'cover' }} />
                          <div style={{ padding: 12 }}>
                            <div style={{ fontSize: 16, fontWeight: 800, color: '#fef08a' }}>{EUR(l.price)}</div>
                            <div style={{ fontSize: 13, fontWeight: 700, color: '#fff' }}>{l.title}</div>
                            <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 4 }}>{l.location}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {selectedListing && (
                  <div>
                    <button onClick={() => setSelectedId(null)} style={{ background: 'transparent', border: 'none', color: '#d4af37', cursor: 'pointer', fontSize: 12, marginBottom: 10 }}>
                      &larr; Back
                    </button>
                    <img src={selectedListing.image} style={{ width: '100%', height: 160, objectFit: 'cover', borderRadius: 12, marginBottom: 12 }} />
                    <div style={{ fontSize: 18, fontWeight: 800, color: '#fef08a' }}>{EUR(selectedListing.price)}</div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: '#fff', marginBottom: 6 }}>{selectedListing.title}</div>
                    <p style={{ fontSize: 12, color: '#cbd5e1', lineHeight: 1.5, marginBottom: 16 }}>{selectedListing.description}</p>
                    <button 
                      onClick={() => setShowSchedule(true)}
                      style={{ width: '100%', background: '#d4af37', color: '#0f172a', border: 'none', padding: 12, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: 'pointer' }}
                    >
                      Schedule Viewing
                    </button>
                  </div>
                )}

                {phoneTab === "saved" && !selectedListing && (
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: '#fff', marginBottom: 14 }}>Saved Properties ({savedIds.length})</div>
                    {listings.filter((l) => savedIds.includes(l.id)).map((l) => (
                      <div key={l.id} onClick={() => openListing(l.id)} style={{ background: '#1e293b', padding: 10, borderRadius: 8, marginBottom: 10, cursor: 'pointer' }}>
                        <div style={{ fontWeight: 700, color: '#fff', fontSize: 13 }}>{l.title}</div>
                        <div style={{ color: '#fef08a', fontSize: 12 }}>{EUR(l.price)}</div>
                      </div>
                    ))}
                  </div>
                )}

                {phoneTab === "messages" && !selectedListing && (
                  <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                    <div style={{ fontSize: 16, fontWeight: 700, color: '#fff', marginBottom: 12 }}>Agent Chat</div>
                    <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 10 }}>
                      {messages.map((m, i) => (
                        <div key={i} style={{
                          alignSelf: m.from === 'me' ? 'flex-end' : 'flex-start',
                          background: m.from === 'me' ? '#d4af37' : '#1e293b',
                          color: m.from === 'me' ? '#0f172a' : '#fff',
                          padding: '8px 12px', borderRadius: 10, fontSize: 12, maxWidth: '80%'
                        }}>
                          {m.text}
                        </div>
                      ))}
                    </div>
                    <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
                      <input 
                        value={draft} onChange={(e) => setDraft(e.target.value)} 
                        placeholder="Type message..." 
                        style={{ flex: 1, background: '#1e293b', border: 'none', color: '#fff', padding: 8, borderRadius: 6, fontSize: 12 }}
                      />
                      <button onClick={sendMessage} style={{ background: '#d4af37', border: 'none', color: '#0f172a', padding: '8px 12px', borderRadius: 6, fontWeight: 700 }}>Send</button>
                    </div>
                  </div>
                )}
              </div>

              {/* Phone Bottom Tab Bar */}
              <div style={{ height: 60, background: '#0f172a', borderTop: '1px solid #1e293b', display: 'flex', justifyContent: 'space-around', alignItems: 'center' }}>
                {[
                  { key: "home", icon: "home", label: "Home" },
                  { key: "saved", icon: "heart", label: "Saved" },
                  { key: "messages", icon: "message-circle", label: "Chat" },
                ].map((t) => (
                  <button key={t.key} onClick={() => { setSelectedId(null); setPhoneTab(t.key); }} style={{ background: 'transparent', border: 'none', color: phoneTab === t.key && !selectedListing ? '#d4af37' : '#64748b', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', fontSize: 10 }}>
                    <Icon name={t.icon} size={18} />
                    <span>{t.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

      </main>

      {/* ------------------------------------------------------------------ */}
      {/* MODAL: SCHEDULE VIEWING                                             */}
      {/* ------------------------------------------------------------------ */}
      {showSchedule && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', zIndex: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div style={{ background: '#0f172a', border: '1px solid #334155', borderRadius: 16, padding: 28, maxWidth: 440, width: '100%', boxShadow: '0 20px 40px rgba(0,0,0,0.5)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <h3 style={{ fontSize: 18, color: '#f8fafc' }}>Schedule Private Viewing</h3>
              <button onClick={() => setShowSchedule(false)} style={{ background: 'transparent', border: 'none', color: '#94a3b8', cursor: 'pointer' }}><Icon name="x" size={20} /></button>
            </div>
            <p style={{ fontSize: 13, color: '#d4af37', marginBottom: 20 }}>{selectedListing?.title}</p>
            
            <div style={{ marginBottom: 16 }}>
              <label style={{ fontSize: 12, color: '#94a3b8', display: 'block', marginBottom: 8 }}>Select Date</label>
              <div style={{ display: 'flex', gap: 8 }}>
                {DATE_CHIPS.map((d) => (
                  <button key={d} onClick={() => setConfirmDate(d)} style={{
                    flex: 1, padding: 8, borderRadius: 6, fontSize: 12, border: '1px solid #334155', cursor: 'pointer',
                    background: confirmDate === d ? '#d4af37' : '#1e293b', color: confirmDate === d ? '#0f172a' : '#fff'
                  }}>{d}</button>
                ))}
              </div>
            </div>

            <div style={{ marginBottom: 24 }}>
              <label style={{ fontSize: 12, color: '#94a3b8', display: 'block', marginBottom: 8 }}>Select Time Slot</label>
              <div style={{ display: 'flex', gap: 8 }}>
                {TIME_CHIPS.map((t) => (
                  <button key={t} onClick={() => setConfirmTime(t)} style={{
                    flex: 1, padding: 8, borderRadius: 6, fontSize: 12, border: '1px solid #334155', cursor: 'pointer',
                    background: confirmTime === t ? '#d4af37' : '#1e293b', color: confirmTime === t ? '#0f172a' : '#fff'
                  }}>{t}</button>
                ))}
              </div>
            </div>

            <button onClick={confirmSchedule} style={{ width: '100%', background: 'linear-gradient(135deg, #d4af37 0%, #a9803f 100%)', color: '#0f172a', border: 'none', padding: 12, borderRadius: 8, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>
              Confirm Viewing Request
            </button>
          </div>
        </div>
      )}

      {/* ------------------------------------------------------------------ */}
      {/* MODAL: ADD LISTING (AGENT PORTAL)                                  */}
      {/* ------------------------------------------------------------------ */}
      {showAddListing && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', zIndex: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <form onSubmit={handleCreateListing} style={{ background: '#0f172a', border: '1px solid #334155', borderRadius: 16, padding: 28, maxWidth: 500, width: '100%' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
              <h3 style={{ fontSize: 18, color: '#f8fafc' }}>Add New Property Listing</h3>
              <button type="button" onClick={() => setShowAddListing(false)} style={{ background: 'transparent', border: 'none', color: '#94a3b8', cursor: 'pointer' }}><Icon name="x" size={20} /></button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 20 }}>
              <input required placeholder="Property Title (e.g. Modern Penthouse)" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} style={{ background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: 10, borderRadius: 6, fontSize: 13 }} />
              <div style={{ display: 'flex', gap: 10 }}>
                <input required type="number" placeholder="Price (€)" value={newPrice} onChange={(e) => setNewPrice(e.target.value)} style={{ flex: 1, background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: 10, borderRadius: 6, fontSize: 13 }} />
                <select value={newType} onChange={(e) => setNewType(e.target.value)} style={{ flex: 1, background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: 10, borderRadius: 6, fontSize: 13 }}>
                  <option value="House">House</option>
                  <option value="Apartment">Apartment</option>
                  <option value="Duplex">Duplex</option>
                </select>
              </div>
              <input placeholder="Location (e.g. Ballsbridge, Dublin 4)" value={newLocation} onChange={(e) => setNewLocation(e.target.value)} style={{ background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: 10, borderRadius: 6, fontSize: 13 }} />
              <textarea placeholder="Description" value={newDesc} onChange={(e) => setNewDesc(e.target.value)} rows={3} style={{ background: '#1e293b', border: '1px solid #334155', color: '#fff', padding: 10, borderRadius: 6, fontSize: 13 }} />
            </div>

            <button type="submit" style={{ width: '100%', background: '#d4af37', color: '#0f172a', border: 'none', padding: 12, borderRadius: 8, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>
              Publish Listing
            </button>
          </form>
        </div>
      )}

      {/* FOOTER */}
      <footer style={{ background: '#080d1a', borderTop: '1px solid #1e293b', padding: '24px 40px', textAlign: 'center', fontSize: 13, color: '#64748b' }}>
        Harlow &amp; Finch Real Estate Platform — Designed for Seamless Client &amp; Agent Interaction
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RealEstateAppDemo />);
</script>
</body>
</html>
